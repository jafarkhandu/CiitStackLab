name: Cleanup PhonePe config

on:
  push:
    paths:
      - '.github/workflows/cleanup-phonepe-config.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Cleanup config
        run: python3 tools/cleanup_phonepe_config.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CIITStackLab.WebApp/appsettings.json
          git commit -m "chore: replace PhonePe config with Razorpay config" || exit 0
          git push
