name: Apply Razorpay UI patch

on:
  push:
    paths:
      - '.github/workflows/apply-razorpay-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/patch_razorpay_ui.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CIITStackLab.WebApp/Areas/Student/Views/Courses/Details.cshtml
          git commit -m "feat: route course checkout through Razorpay" || exit 0
          git push
