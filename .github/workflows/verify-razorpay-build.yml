name: Verify Razorpay build

on:
  push:
    paths:
      - '.github/workflows/verify-razorpay-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CIITStackLab.slnx

      - name: Build
        run: dotnet build CIITStackLab.slnx --configuration Release --no-restore

      # Temporary verification only.
